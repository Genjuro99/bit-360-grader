plugins {
    id 'com.android.application'
}

android {
    namespace 'com.believeintaste.bit360grader'
    compileSdk 36

    defaultConfig {
        applicationId 'com.believeintaste.bit360grader'
        minSdk 26
        targetSdk 36
        versionCode 103
        versionName '1.0.3-test'
    }

    buildTypes {
        debug {
            // Separate package preserves the previously installed test app and its data.
            applicationIdSuffix '.repairtest'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
